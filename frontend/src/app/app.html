<app-svg-defs />

<a class="skip" href="/" (click)="skipToMain($event)">Skip to main content</a>

<header>
  <div class="wrap">
    <a class="brand" routerLink="/">
      <span class="badge">
        <svg class="gl" viewBox="0 0 240 110" role="img" aria-label="Tilted glasses logo"><use href="#glasses" /></svg>
      </span>
      Put on the glasses
    </a>
    <nav aria-label="Main">
      <ul>
        <li><a routerLink="/" routerLinkActive="current" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
        <li><a routerLink="/tester" routerLinkActive="current" ariaCurrentWhenActive="page">Tester</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main" #main tabindex="-1">
  <router-outlet />
</main>

<footer>
  <div class="wrap">
    <p>Human-Computer Interaction project, Faculty of Engineering, Alexandria University.</p>
  </div>
</footer>
